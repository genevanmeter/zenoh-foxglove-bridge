[package]
name = "zenoh-foxglove-bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "zenoh_plugin_foxglove"
crate-type = ["rlib", "cdylib"]

[dependencies]
foxglove = { version = "=0.27.0", default-features = false, features = ["websocket"] }
zenoh = { version = "=1.10.1", features = ["plugins", "unstable", "internal"] }
zenoh-plugin-trait = "=1.10.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
prost-types = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = "0.3"
base64 = "0.22"
